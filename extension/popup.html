<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FresherPilot Autofill</title>
    <style>
      :root { --bg: #fff; --text: #15202b; --muted: #5e6b7b; --line: #e1e5eb; --accent: #0f8a5f; --warn: #8f6200; --warn-bg: #fcf2da; --bad: #b42318; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #161d25; --text: #e6edf4; --muted: #93a3b6; --line: #27313d; --accent: #5fd4a4; --warn: #f0c060; --warn-bg: #30270f; --bad: #ff8a80; }
      }
      body { margin: 0; width: 320px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { padding: 14px 16px 16px; display: grid; gap: 10px; }
      h1 { font-size: 15px; margin: 0; }
      p { margin: 0; }
      .muted { color: var(--muted); font-size: 12px; }
      button { font: inherit; font-weight: 600; border-radius: 999px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .55; cursor: wait; }
      label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
      .result { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
      .result[hidden] { display: none; }
      .ok { color: var(--accent); font-weight: 600; }
      .warn { color: var(--warn); }
      .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
      .notice[hidden] { display: none; }
      .err { color: var(--bad); font-size: 12px; }
      a { color: var(--accent); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 12px; }
      details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>FresherPilot Autofill</h1>
      <p id="server" class="muted">Checking the FresherPilot app…</p>
      <p id="missing" class="notice" hidden></p>
      <button id="fill" class="primary" type="button">Fill this page</button>
      <label><input type="checkbox" id="overwrite" /> Also replace fields that already have text</label>
      <div id="result" class="result" hidden></div>
      <div class="row">
        <button id="applied" type="button" hidden>Mark this job as applied</button>
      </div>
      <p class="muted">Green outline = filled, orange = needs you. Multi-step forms: click Fill on each step. Nothing is ever submitted for you. Shortcut: Alt+Shift+F.</p>
      <div class="row muted"><a id="openApp" href="#">Open FresherPilot</a> · <a id="openProfile" href="#">Edit profile</a></div>
      <details>
        <summary>Settings</summary>
        <p class="muted" style="margin:6px 0 4px">FresherPilot app address</p>
        <input id="serverUrl" type="text" placeholder="http://localhost:8000" />
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
